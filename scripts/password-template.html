<!DOCTYPE html>
<html lang="en" class="staticrypt-html">
  <head>
    <meta charset="utf-8" />
    <title>/*[|template_title|]*/0</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex, nofollow" />
    <meta name="color-scheme" content="light dark" />
    <meta http-equiv="cache-control" content="no-cache" />
    <style>
/*TOKENS*/
      * { box-sizing: border-box; }
      html, body { height: 100%; margin: 0; }
      body {
        font-family: var(--font-sans);
        background: var(--bg);
        color: var(--text);
        display: flex;
        align-items: center;
        justify-content: center;
        padding: var(--space-3);
        -webkit-font-smoothing: antialiased;
      }
      .hidden { display: none !important; }
      .card {
        width: 100%;
        max-width: 22rem;
        background: var(--surface);
        border-radius: var(--radius);
        padding: var(--space-5) var(--space-4);
      }
      h1 { font-size: 1.5rem; font-weight: 600; letter-spacing: -0.01em; margin: 0 0 var(--space-2); }
      p { margin: 0 0 var(--space-4); color: var(--text-secondary); line-height: 1.45; }
      .field { position: relative; margin-bottom: var(--space-3); }
      .sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
      input[type="password"], input[type="text"] {
        width: 100%;
        font: inherit;
        font-size: 1rem;
        color: var(--text);
        background: var(--bg);
        border: 1px solid var(--border);
        border-radius: var(--radius-small);
        padding: 0.75rem 4.5rem 0.75rem 0.875rem;
      }
      input:focus-visible, button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
      .toggle {
        position: absolute; right: var(--space-2); top: 50%; transform: translateY(-50%);
        font: inherit; font-size: 0.875rem; color: var(--accent);
        background: none; border: 0; padding: var(--space-2); cursor: pointer;
      }
      .remember { display: flex; align-items: center; gap: var(--space-2); font-size: 0.9375rem; color: var(--text-secondary); margin-bottom: var(--space-4); }
      .submit {
        width: 100%; font: inherit; font-size: 1rem; font-weight: 600;
        color: var(--accent-text); background: var(--accent);
        border: 0; border-radius: var(--radius-small); padding: 0.75rem; cursor: pointer;
      }
      .error { color: var(--danger); font-size: 0.9375rem; margin: 0 0 var(--space-3); min-height: 1.25rem; }
      .spinner { color: var(--text-secondary); }
    </style>
  </head>
  <body>
    <div id="staticrypt_loading" class="spinner">Loading…</div>

    <main id="staticrypt_content" class="card hidden">
      <h1>/*[|template_title|]*/0</h1>
      <p>/*[|template_instructions|]*/0</p>
      <form id="staticrypt-form" action="#" method="post">
        <div class="field">
          <label for="staticrypt-password" class="sr-only">/*[|template_placeholder|]*/0</label>
          <input id="staticrypt-password" type="password" name="password" autocomplete="current-password" placeholder="/*[|template_placeholder|]*/0" autofocus />
          <button type="button" class="toggle" id="staticrypt-toggle" aria-controls="staticrypt-password">/*[|template_toggle_show|]*/0</button>
        </div>
        <p id="staticrypt-error" class="error" role="alert" aria-live="polite"></p>
        <label id="staticrypt-remember-label" class="remember hidden">
          <input id="staticrypt-remember" type="checkbox" name="remember" />
          /*[|template_remember|]*/0
        </label>
        <button type="submit" class="submit">/*[|template_button|]*/0</button>
      </form>
    </main>

    <script>
      // Filled in when the file is generated; format '/*[|variable_name|]*/0'.
      const staticryptInitiator = /*[|js_staticrypt|]*/ 0;
      const templateError = "/*[|template_error|]*/0",
        templateToggleShow = "/*[|template_toggle_show|]*/0",
        templateToggleHide = "/*[|template_toggle_hide|]*/0",
        isRememberEnabled = /*[|is_remember_enabled|]*/ 0,
        staticryptConfig = /*[|staticrypt_config|]*/ 0;

      const templateConfig = {
        rememberExpirationKey: "staticrypt_expiration",
        rememberPassphraseKey: "staticrypt_passphrase",
        replaceHtmlCallback: null,
        clearLocalStorageCallback: null,
      };

      const staticrypt = staticryptInitiator.init(staticryptConfig, templateConfig);

      window.onload = async function () {
        const { isSuccessful } = await staticrypt.handleDecryptOnLoad();
        if (!isSuccessful) {
          document.getElementById("staticrypt_loading").classList.add("hidden");
          document.getElementById("staticrypt_content").classList.remove("hidden");
          document.getElementById("staticrypt-password").focus();
          if (isRememberEnabled) {
            document.getElementById("staticrypt-remember-label").classList.remove("hidden");
          }
        }
      };

      const input = document.getElementById("staticrypt-password");
      const toggle = document.getElementById("staticrypt-toggle");
      toggle.addEventListener("click", function () {
        const hidden = input.type === "password";
        input.type = hidden ? "text" : "password";
        toggle.textContent = hidden ? templateToggleHide : templateToggleShow;
      });

      document.getElementById("staticrypt-form").addEventListener("submit", async function (e) {
        e.preventDefault();
        const remember = document.getElementById("staticrypt-remember").checked;
        const { isSuccessful } = await staticrypt.handleDecryptionOfPage(input.value, remember);
        document.getElementById("staticrypt-error").textContent = isSuccessful ? "" : templateError;
      });
    </script>
  </body>
</html>
