name: Deploy to GitHub Pages

# Manual trigger by design (see specs/2026-10-09-site-scaffold/requirements.md).
# To deploy automatically, add:  push: { branches: [<default-branch>] }
on:
  workflow_dispatch:
    inputs:
      protect:
        description: 'Password-protect / and /supervisor/ (tick before real private material is added)'
        type: boolean
        default: false

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run check
      # When protect is ticked this fails closed: a missing, empty or weak password secret stops the deploy before upload.
      # Fail-closed: protection is skipped ONLY when the input is exactly 'false'. A missing input (for example
      # a re-run of an older run) counts as protected, because an empty value is not the string 'false'.
      - if: ${{ format('{0}', inputs.protect) != 'false' }}
        run: npm run build:protected
        env:
          RESEARCHER_PASSWORD: ${{ secrets.RESEARCHER_PASSWORD }}
          SUPERVISOR_PASSWORD: ${{ secrets.SUPERVISOR_PASSWORD }}
      # Explicit opt-out for testing: publishes / and /supervisor/ as plain, public pages.
      - if: ${{ format('{0}', inputs.protect) == 'false' }}
        run: |
          echo "::warning::Deploying WITHOUT password protection: / and /supervisor/ will be public."
          npm run build
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
