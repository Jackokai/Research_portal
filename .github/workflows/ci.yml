name: CI

on:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run build
      - run: npm run check:external
      # Exercise the protection step with throwaway passwords (not secrets).
      - run: npm run build:protected
        env:
          RESEARCHER_PASSWORD: ci-throwaway-researcher-1
          SUPERVISOR_PASSWORD: ci-throwaway-supervisor-1
